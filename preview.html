<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备预览 - 创新玩乐商详</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .phone {
            position: relative;
            /* 设计稿原始尺寸：750x1624 + 边框 */
            width: 774px;
            height: 1648px;
            border-radius: 80px;
            background: #111;
            padding: 12px;
            box-shadow:
                inset 0 0 0 1px #333,
                0 20px 50px rgba(0,0,0,0.25);
            /* 固定缩放50% */
            transform: scale(0.5);
            transform-origin: center center;
        }

        /* 右侧电源键 */
        .phone::before {
            content: '';
            position: absolute;
            right: -3px;
            top: 280px;
            width: 4px;
            height: 100px;
            background: #222;
            border-radius: 0 2px 2px 0;
        }

        /* 左侧音量键 */
        .phone::after {
            content: '';
            position: absolute;
            left: -3px;
            top: 240px;
            width: 4px;
            height: 55px;
            background: #222;
            border-radius: 2px 0 0 2px;
            box-shadow: 0 80px 0 #222, 0 140px 0 #222;
        }

        .screen {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 68px;
            overflow: hidden;
            background: #000;
        }

        /* 灵动岛 */
        .dynamic-island {
            position: absolute;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            width: 250px;
            height: 50px;
            background: #000;
            border-radius: 33px;
            z-index: 100;
            box-shadow: 0 0 0 3px #000;
        }

        /* Home 指示条 */
        .home-indicator {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 268px;
            height: 10px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            z-index: 100;
        }

        .screen iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .label {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            color: #aaa;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="phone" id="phone">
        <div class="screen">
            <div class="dynamic-island"></div>
            <div class="home-indicator"></div>
            <iframe src="index.html" allow="autoplay; fullscreen"></iframe>
        </div>
    </div>
    <div class="label">750×1624 · 50% 缩放</div>

    <script>
    // 固定50%缩放，无需动态计算
    </script>
</body>
</html>
